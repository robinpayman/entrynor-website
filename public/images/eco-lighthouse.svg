<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <defs>
    <style>
      .eco-logo-text { font-family: Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #000; }
      .eco-logo-reg { font-family: Arial, sans-serif; font-size: 24px; fill: #000; }
      .eco-box { fill: #000; rx: 24; }
      .eco-circle { fill: #fff; }
      .eco-leaf { fill: #000; }
    </style>
  </defs>
  
  <!-- Logo box (left side) -->
  <rect x="12" y="30" width="140" height="120" class="eco-box"/>
  
  <!-- White circle inside box -->
  <circle cx="82" cy="90" r="55" class="eco-circle"/>
  
  <!-- Black leaf shape (stylized) -->
  <path d="M 82 50 Q 100 65 100 90 Q 100 115 82 130 Q 64 115 64 90 Q 64 65 82 50 Z" class="eco-leaf"/>
  
  <!-- Divider -->
  <line x1="170" y1="30" x2="170" y2="150" stroke="#000" stroke-width="2"/>
  
  <!-- Text (right side) -->
  <text x="195" y="95" class="eco-logo-text">Eco-Lighthouse</text>
  <text x="195" y="135" class="eco-logo-text" font-size="42">®</text>
  
  <!-- Certified Business box -->
  <rect x="200" y="50" width="185" height="100" fill="#e8e8e8" rx="12"/>
  <text x="292" y="105" class="eco-logo-text" text-anchor="middle">CERTIFIED</text>
  <text x="292" y="140" class="eco-logo-text" text-anchor="middle">BUSINESS</text>
</svg>